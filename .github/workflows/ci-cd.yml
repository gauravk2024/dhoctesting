name: CI/CD - Spring Boot to ECR/EC2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Spring Boot App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar (skip tests for now)
        working-directory: health
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

  docker-and-deploy:
    name: Push Docker Image and Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment configuration
        id: precheck
        run: |
          can_push=true
          can_deploy=true

          [ -n "$AWS_ACCESS_KEY_ID" ] || can_push=false
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || can_push=false
          [ -n "$AWS_REGION" ] || can_push=false
          [ -n "$AWS_ACCOUNT_ID" ] || can_push=false
          [ -n "$ECR_REPOSITORY" ] || can_push=false

          [ -n "$EC2_HOST" ] || can_deploy=false
          [ -n "$EC2_USERNAME" ] || can_deploy=false
          [ -n "$EC2_SSH_KEY" ] || can_deploy=false

          echo "can_push=$can_push" >> "$GITHUB_OUTPUT"
          echo "can_deploy=$can_deploy" >> "$GITHUB_OUTPUT"

      - name: Inform skipped AWS steps
        if: ${{ steps.precheck.outputs.can_push != 'true' }}
        run: |
          echo "AWS/ECR configuration not found yet."
          echo "Build is complete. Add required GitHub secrets/variables to enable push/deploy steps."

      - name: Configure AWS credentials
        if: ${{ steps.precheck.outputs.can_push == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ steps.precheck.outputs.can_push == 'true' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        id: push-image
        if: ${{ steps.precheck.outputs.can_push == 'true' }}
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" health
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 via SSH
        if: ${{ steps.precheck.outputs.can_push == 'true' && steps.precheck.outputs.can_deploy == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE_URI="${{ steps.push-image.outputs.image_uri }}"
            docker pull "$IMAGE_URI"
            docker stop health-app || true
            docker rm health-app || true
            docker run -d --name health-app -p 8080:8080 "$IMAGE_URI"

      - name: Inform skipped EC2 deploy
        if: ${{ steps.precheck.outputs.can_push == 'true' && steps.precheck.outputs.can_deploy != 'true' }}
        run: |
          echo "Image pushed to ECR, but EC2 deployment is skipped."
          echo "Set EC2_HOST, EC2_USERNAME, and EC2_SSH_KEY secrets to enable deployment."
